<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05070b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>水母 · 手势交互</title>
<link rel="stylesheet" href="./styles.css" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js"
  }
}
</script>
</head>
<body>

<canvas id="gl"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<!-- 顶部状态 -->
<header class="hud">
  <div class="chip" id="gesture" data-kind="idle">准备中</div>
  <div class="hud-hint">握拳收缩 · 张开绽放 · 双指缩放</div>
</header>

<!-- 摄像头小窗 + 骨架 -->
<div id="camwrap">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="landmarks" width="320" height="240"></canvas>
</div>

<!-- 底部操作 -->
<footer class="dock">
  <button class="ghost" data-force="fist">握拳</button>
  <button class="ghost" data-force="open">张开</button>
  <button class="ghost" data-force="neutral">漂浮</button>
</footer>

<div id="toast" role="status"></div>

<!-- 开场 -->
<section id="intro">
  <div class="intro-card">
    <div class="eyebrow">MEDIAPIPE HANDS × THREE.JS</div>
    <h1>把手<br /><em>放进海里</em></h1>
    <p class="lede">
      打开摄像头，握拳时水母收拢，手掌张开时它向外绽放。<br />
      移动手掌可以引导它游动的方向。
    </p>
    <div class="actions">
      <button id="btn-camera" class="primary">开启摄像头</button>
      <button id="btn-skip" class="link">先看看效果</button>
    </div>
    <p class="fineprint">摄像头画面只在你的设备上处理，不会上传。</p>
  </div>
</section>

<script type="module" src="./js/main.js"></script>
</body>
</html>
